services:
  redpanda:
    image: redpandadata/redpanda:v24.3.6
    command: ["redpanda","start","--overprovisioned","--smp=1","--memory=1G","--reserve-memory=0M","--node-id=0","--check=false","--kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092","--advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092"]
    ports: ["19092:19092","9644:9644"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --brokers=localhost:9092"]
      interval: 5s
      timeout: 5s
      retries: 20
  console:
    image: redpandadata/console:v2.8.1
    environment: {KAFKA_BROKERS: redpanda:9092}
    ports: ["8080:8080"]
    depends_on: [redpanda]
  db:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: portfolio, POSTGRES_PASSWORD: portfolio, POSTGRES_DB: transactions}
    ports: ["5435:5432"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U portfolio -d transactions"]
      interval: 5s
      timeout: 5s
      retries: 10
  worker:
    build: .
    command: ["python","-m","app.worker"]
    environment:
      KAFKA_BOOTSTRAP: redpanda:9092
      DATABASE_URL: postgresql://portfolio:portfolio@db:5432/transactions
    depends_on:
      db: {condition: service_healthy}
      redpanda: {condition: service_started}
  producer:
    build: .
    command: ["python","-m","app.producer","--count","100"]
    environment: {KAFKA_BOOTSTRAP: redpanda:9092}
    depends_on:
      redpanda: {condition: service_healthy}
      worker: {condition: service_started}
